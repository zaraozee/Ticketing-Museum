name: CI Pipeline

on:
  push:
    branches: [ main, 'fase-*' ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketing_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, redis, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ticketing/package-lock.json'

      - name: Copy .env
        run: cp ticketing/.env.example ticketing/.env

      - name: Install Composer dependencies
        working-directory: ./ticketing
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        working-directory: ./ticketing
        run: php artisan key:generate

      - name: Install NPM dependencies & Build assets
        working-directory: ./ticketing
        run: |
          npm ci || npm install
          npm run build

      - name: Run Laravel Pint (Code Style)
        working-directory: ./ticketing
        run: ./vendor/bin/pint --test

      - name: Run Larastan (Static Analysis)
        working-directory: ./ticketing
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run Pest (Tests)
        working-directory: ./ticketing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ticketing_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: ./vendor/bin/pest

