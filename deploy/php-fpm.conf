; Pool PHP-FPM untuk Jejak (Fase 9).
;
; Letakkan di /etc/php/8.4/fpm/pool.d/jejak.conf lalu:
;   systemctl reload php8.4-fpm
;
; Socket UNIX dipakai agar Nginx dan PHP tidak melewati jaringan.

[jejak]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-jejak.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; `pm = dynamic` cukup untuk MVP. Naikkan `pm.max_children` setelah mengukur
; pemakaian memori nyata: setiap worker Laravel memakai ±40-60 MB.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Permintaan yang menggantung lebih lama dari ini dipotong agar worker tidak
; habis dipakai request yang macet.
request_terminate_timeout = 60s

; Log perlahan (slowlog) membantu menemukan endpoint yang lambat.
request_slowlog_timeout = 5s
slowlog = /var/log/php/jejak-slow.log

php_admin_value[error_log] = /var/log/php/jejak-fpm.log
php_admin_flag[log_errors] = on

; Batas unggah harus selaras dengan `client_max_body_size` di Nginx.
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M

; Sembunyikan versi PHP dari header respons.
php_admin_flag[expose_php] = off

; Timezone aplikasi; tanggal kunjungan tetap memakai zona waktu museum.
php_admin_value[date.timezone] = UTC

; OPcache: kode tidak berubah antar-request, jadi cache besar menguntungkan.
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 192
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0

; Variabel environment yang perlu tersedia untuk proses PHP.
env[APP_ENV] = production
