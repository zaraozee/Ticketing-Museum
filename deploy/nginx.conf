# Konfigurasi Nginx untuk MusenTix (SYSTEM_DESIGN §8, Fase 9).
#
# Letakkan di /etc/nginx/sites-available/jejak dan aktifkan dengan
#   ln -s /etc/nginx/sites-available/jejak /etc/nginx/sites-enabled/jejak
#
# Ganti jejak.example.com dan /var/www/jejak sesuai lingkungan.
# Sertifikat dikelola certbot (Let's Encrypt); baris TLS di bawah diisi otomatis
# oleh `certbot --nginx`.

upstream jejak_php {
    server unix:/run/php/php8.4-fpm-jejak.sock;
}

# Rate limit di lapisan Nginx sebagai pertahanan berlapis. Batas aplikasi
# (config/security.php) tetap yang berlaku; ini meredam banjir request sebelum
# menyentuh PHP.
limit_req_zone $binary_remote_addr zone=jejak_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=jejak_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name jejak.example.com;

    # Biarkan certbot menangani tantangan ACME, sisanya dialihkan ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jejak.example.com;

    root /var/www/jejak/public;
    index index.php;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/jejak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jejak.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Header keamanan -----------------------------------------------------
    # HSTS juga dikirim aplikasi (SecurityHeaders) saat request HTTPS; menaruhnya
    # di sini memastikan header tetap ada walau PHP gagal.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Batas ukuran --------------------------------------------------------
    # Unggah foto museum; sesuaikan dengan batas validasi aplikasi.
    client_max_body_size 12M;

    # --- Kompresi ------------------------------------------------------------
    # Service worker dan manifest sengaja tidak dikompresi: ukurannya kecil dan
    # ETag yang konsisten lebih penting untuk deteksi pembaruan SW.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # --- Aset statis ---------------------------------------------------------
    # File ber-hash dari Vite boleh di-cache lama; sisanya tidak.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Service worker di root dengan scope penuh (Fase 8). Cache-Control
    # no-store wajib agar browser selalu memeriksa versi baru.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Aplikasi ------------------------------------------------------------
    location / {
        limit_req zone=jejak_general burst=40 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        limit_req zone=jejak_login burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass jejak_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Jangan pernah mengeksekusi PHP di dalam folder unggahan.
    location ~* ^/(storage|uploads)/.*\.php$ {
        deny all;
    }

    # --- Larangan akses ------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sqlite|sql|md|lock)$ {
        deny all;
    }

    access_log /var/log/nginx/jejak.access.log;
    error_log  /var/log/nginx/jejak.error.log warn;
}
