; Supervisor untuk worker antrean Jejak (Fase 9).
;
; Letakkan di /etc/supervisor/conf.d/jejak-worker.conf lalu:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status
;
; Tanpa worker yang hidup, email e-ticket dan pengingat H-1 tidak pernah
; terkirim, dan `ops:health` akan melaporkan "Antrean menunggu".

[program:jejak-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/jejak/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60
directory=/var/www/jejak
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/jejak/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=70

; `--max-time=3600` membuat worker berhenti sendiri setiap jam; Supervisor
; menyalakannya lagi. Ini mencegah kebocoran memori menumpuk.
;
; `numprocs=2` memberi ruang saat satu worker sedang menangani job lambat
; (mis. SMTP yang menggantung). Naikkan bila panjang antrean menetap > 0.

[program:jejak-scheduler]
; Alternatif bila cron tidak tersedia di server. Pilih salah satu: cron
; (`* * * * * php artisan schedule:run`) atau program ini, jangan keduanya.
command=php /var/www/jejak/artisan schedule:work
directory=/var/www/jejak
autostart=false
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/jejak/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
